apiVersion: apps/v1            
kind: Deployment              
metadata:
  name: ui-deployment
  namespace: digitalopsdev 
  labels:
    app: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: aksdigitalopsregistry.azurecr.io/ui:v3
          ports:
            - containerPort: 80

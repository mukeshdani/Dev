apiVersion: v1
Kind : Deployment
metadata:
  name: ui-deployment
  labels:
    app: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: aksdigitalopsregistry.azurecr.io/ui:v1
          ports:
            - containerPort: 80

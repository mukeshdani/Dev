<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Portal A</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin-top: 120px; background-color: #f4f7f6; color: #2c3e50; }
        .container { max-width: 600px; margin: 0 auto; padding: 40px; background: #ffffff; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #1a73e8; font-size: 36px; margin-bottom: 10px; }
        p { font-size: 18px; color: #5f6368; line-height: 1.6; }
        .badge { display: inline-block; padding: 6px 12px; background: #e8f0fe; color: #1a73e8; border-radius: 4px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Application Services - Cluster A</h1>
        <p>This production environment is operating statefully within an isolated container runtime network.</p>
        <span class="badge">Deployment: Active</span>
    </div>
</body>
</html>

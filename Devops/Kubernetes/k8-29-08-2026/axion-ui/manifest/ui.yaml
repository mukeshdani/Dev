apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-service
  namespace: mkdspace
  labels:
    app: ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
      - name: ui
        image: axionacr2.azurecr.io/ui-service:v2
        ports:
        - containerPort: 8000

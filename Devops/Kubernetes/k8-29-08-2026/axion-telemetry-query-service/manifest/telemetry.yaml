apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-service
  namespace: mkdspace
  labels:
    app: telemetry
spec:
  replicas: 2
  selector:
    matchLabels:
      app: telemetry
  template:
    metadata:
      labels:
        app: telemetry
    spec:
      containers:
      - name: telemetry
        image: axionacr2.azurecr.io/telemetry-service:v2
        ports:
        - containerPort: 8000

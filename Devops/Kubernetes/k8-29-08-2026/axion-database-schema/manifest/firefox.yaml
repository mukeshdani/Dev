apiVersion: apps/v1
kind: Deployment
metadata:
  name: firefox
  namespace: mkdspace
  labels:
    app: firefox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: firefox
  template:
    metadata:
      labels:
        app: firefox
    spec:
      containers:
      - name: firefox
        image: lscr.io/linuxserver/firefox:latest
        ports:
        - containerPort: 3000 

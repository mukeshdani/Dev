---
apiVersion: v1
kind: Namespace
metadata:
  name: axion-iot
---
# Secrets & Config
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: axion-iot
type: Opaque
stringData:
  POSTGRES_USER: axion_user
  POSTGRES_PASSWORD: SecretPassword123!
  POSTGRES_DB: axion_db
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: axion-config
  namespace: axion-iot
data:
  DB_HOST: axion-db-svc
  DB_PORT: "5432"
  INGESTION_SERVICE_URL: "http://axion-ingestion-svc:8080"
  TELEMETRY_SERVICE_URL: "http://axion-telemetry-svc:8080"

---
# 1. Database Layer (Uses Custom Schema Image)
apiVersion: v1
kind: Service
metadata:
  name: axion-db-svc
  namespace: axion-iot
spec:
  ports:
  - port: 5432
  selector:
    app: axion-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: axion-db
  namespace: axion-iot
spec:
  serviceName: "axion-db-svc"
  replicas: 1
  selector:
    matchLabels:
      app: axion-db
  template:
    metadata:
      labels:
        app: axion-db
    spec:
      containers:
      - name: postgres
        image: mukeshdani9/axion-database-schema:latest
        ports:
        - containerPort: 5432
        envFrom:
        - secretRef:
            name: db-credentials
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: pgdata
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi

---
# 2. Ingestion Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: axion-ingestion-service
  namespace: axion-iot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: axion-ingestion
  template:
    metadata:
      labels:
        app: axion-ingestion
    spec:
      containers:
      - name: ingestion-app
        image: mukeshdani9/axion-ingestion-service:latest
        ports:
        - containerPort: 8080 
        envFrom:
        - configMapRef:
            name: axion-config
        - secretRef:
            name: db-credentials
---
apiVersion: v1
kind: Service
metadata:
  name: axion-ingestion-svc
  namespace: axion-iot
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: axion-ingestion

---
# 3. Telemetry Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: axion-telemetry-service
  namespace: axion-iot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: axion-telemetry
  template:
    metadata:
      labels:
        app: axion-telemetry
    spec:
      containers:
      - name: telemetry-app
        image: mukeshdani9/axion-telemetry-query-service:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: axion-config
        - secretRef:
            name: db-credentials
---
apiVersion: v1
kind: Service
metadata:
  name: axion-telemetry-svc
  namespace: axion-iot
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: axion-telemetry

---
# 4. Frontend UI
apiVersion: apps/v1
kind: Deployment
metadata:
  name: axion-ui
  namespace: axion-iot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: axion-ui
  template:
    metadata:
      labels:
        app: axion-ui
    spec:
      containers:
      - name: ui-app
        image: mukeshdani9/axion-ui:latest
        ports:
        - containerPort: 80
        env:
        - name: REACT_APP_TELEMETRY_API
          value: "http://tele.axion.com"
---
apiVersion: v1
kind: Service
metadata:
  name: axion-ui-svc
  namespace: axion-iot
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: axion-ui

---
# 5. Data Simulator
apiVersion: apps/v1
kind: Deployment
metadata:
  name: axion-simulator
  namespace: axion-iot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: axion-simulator
  template:
    metadata:
      labels:
        app: axion-simulator
    spec:
      containers:
      - name: simulator
        image: mukeshdani9/axion-data-simulator:latest
        envFrom:
        - configMapRef:
            name: axion-config

---
# 6. Ingress Routing
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: axion-ingress
  namespace: axion-iot
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: ui.axion.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: axion-ui-svc
            port:
              number: 80
  - host: tele.axion.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: axion-telemetry-svc
            port:
              number: 80
  - host: ingest.axion.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: axion-ingestion-svc
            port:
              number: 80

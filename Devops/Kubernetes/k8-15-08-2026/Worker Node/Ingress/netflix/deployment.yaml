apiVersion: apps/v1
kind: Deployment
metadata:
  name: mukeshui-b
  labels:
    app: mukeshui-b
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mukeshui-b
  template:
    metadata:
      labels:
        app: mukeshui-b
    spec:
      containers:
      - name: mukeshui-b
        image: docker.io/mukeshdani9/mukeshui-b:v1.0.0
        ports:
        - containerPort: 80
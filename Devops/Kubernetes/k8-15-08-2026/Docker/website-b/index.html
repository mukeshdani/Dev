<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin-top: 120px; background-color: #fafafa; color: #212121; }

    <div class="container">
        <h1>Application Services - Cluster B</h1>
